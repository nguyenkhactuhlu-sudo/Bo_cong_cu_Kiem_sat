<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ điều hành Bộ công cụ - Viện Kiểm Sát Nhân Dân</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky: #5da9d9;
            --sky-light: #a8d4f0;
            --sky-dark: #1e5a8a;
            --bronze: #c9952e;
            --bronze-light: #e8c675;
            --plum: #7b2d42;
            --plum-dark: #5a1f30;
            --plum-light: #a84560;
            --white-soft: rgba(255, 255, 255, 0.96);
            --taskbar-height: 42px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Be Vietnam Pro', Arial, sans-serif;
            color: #333;
            min-height: 100vh;
            background:
                linear-gradient(135deg, rgba(93, 169, 217, 0.78) 0%, rgba(123, 45, 66, 0.55) 55%, rgba(201, 149, 46, 0.45) 100%),
                url('./static/Nen.jpg') center / cover no-repeat fixed;
            overflow-x: hidden;
        }

        /* ===== MÀN HÌNH CHỜ (LOCK SCREEN) ===== */
        #landing-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: opacity 0.5s ease;
        }

        .orbit-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 20px;
            border-radius: 50%;
        }

        .logo-static {
            width: 220px;
            height: auto;
            position: relative;
            z-index: 5;
            filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.15));
            animation: logo_sang 5s ease-in-out infinite;
        }


        /* ===== VÒNG SÁNG RADAR ===== */
        .radar-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 280px;
            height: 280px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(232, 198, 117, 0.2);
            animation: radarRingPulse 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        .radar-ring-2 {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 320px;
            height: 320px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(93, 169, 217, 0.12);
            animation: radarRingPulse2 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 1;
        }

        /* ===== TIA QUÉT RADAR ===== */
        .radar-sweep {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 280px;
            height: 280px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .radar-sweep::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: conic-gradient(
                transparent 0deg,
                transparent 295deg,
                rgba(232, 198, 117, 0.06) 305deg,
                rgba(255, 248, 220, 0.15) 315deg,
                rgba(232, 198, 117, 0.25) 320deg,
                rgba(255, 248, 220, 0.35) 325deg,
                rgba(232, 198, 117, 0.15) 330deg,
                rgba(232, 198, 117, 0.04) 340deg,
                transparent 350deg,
                transparent 360deg
            );
            animation: radarSweepRotate 4s linear infinite;
            border-radius: 50%;
        }

        /* ===== ĐỐM SÁNG MỤC TIÊU RADAR (JS sinh ngẫu nhiên) ===== */
        .radar-target {
            position: absolute;
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .radar-target.visible {
            opacity: 1;
        }

        .radar-target.hit {
            animation: targetHit 0.6s ease-out forwards;
        }

        @keyframes targetHit {
            0% { transform: scale(0); opacity: 0; }
            20% { transform: scale(2); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(1); opacity: 0.6; }
        }

        .orbit-container:active {


            transform: scale(0.98);
        }

        @keyframes radarRingPulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1); 
                opacity: 0.6; 
                border-color: rgba(232, 198, 117, 0.2);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.05); 
                opacity: 1; 
                border-color: rgba(232, 198, 117, 0.4);
            }
        }

        @keyframes radarRingPulse2 {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1); 
                opacity: 0.4; 
                border-color: rgba(93, 169, 217, 0.12);
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.08); 
                opacity: 0.8; 
                border-color: rgba(93, 169, 217, 0.25);
            }
        }

        @keyframes radarSweepRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes logo_sang {

            0%, 100% { filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.15)) brightness(1); }
            50% { filter: drop-shadow(0 0 30px rgba(232, 198, 117, 0.5)) brightness(1.08); }
        }


        /* ===== TIÊU ĐỀ LANDING (DẠNG INTRO) ===== */
        .landing-title {
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
            animation: titleCycle 8s ease-in-out infinite;
            line-height: 2.0;
            text-align: center;
            margin-top: 10px;
            padding: 12px 30px;
            max-width: 95vw;
        }




        .landing-title .landing-title-highlight {
            background: linear-gradient(135deg, #e8c675, #f5d98a, #c9952e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes titleCycle {
            0% { 
                opacity: 0; 
                transform: translateY(20px) scale(0.95);
                clip-path: inset(0 0 100% 0);
            }
            15% { 
                opacity: 1; 
                transform: translateY(0) scale(1);
                clip-path: inset(0 0 0 0);
            }
            85% { 
                opacity: 1; 
                transform: translateY(0) scale(1);
                clip-path: inset(0 0 0 0);
            }
            100% { 
                opacity: 0; 
                transform: translateY(-20px) scale(0.95);
                clip-path: inset(100% 0 0 0);
            }
        }

        .landing-divider {
            width: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(232, 198, 117, 0.6), transparent);
            margin: 12px auto;
            border-radius: 2px;
            animation: dividerCycle 8s ease-in-out infinite;
        }

        @keyframes dividerCycle {
            0% { width: 0; opacity: 0; }
            15% { width: 60%; max-width: 400px; opacity: 1; }
            85% { width: 60%; max-width: 400px; opacity: 1; }
            100% { width: 0; opacity: 0; }
        }

        .landing-subtitle {
            font-size: clamp(12px, 1.8vw, 18px);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 8px;
            text-transform: uppercase;
            animation: subtitleCycle 8s ease-in-out infinite;
        }

        @keyframes subtitleCycle {
            0% { opacity: 0; transform: translateY(10px); letter-spacing: 20px; }
            15% { opacity: 1; transform: translateY(0); letter-spacing: 8px; }
            85% { opacity: 1; transform: translateY(0); letter-spacing: 8px; }
            100% { opacity: 0; transform: translateY(-10px); letter-spacing: 20px; }
        }


        /* ===== DASHBOARD / MÀN HÌNH CHÍNH (DESKTOP) ===== */

        #dashboard-page {
            display: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            padding: 70px 20px calc(var(--taskbar-height) + 30px);
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            min-height: 100vh;
        }

        #dashboard-page.visible-layout {
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #ffffff;
            font-size: clamp(22px, 4vw, 32px);
            margin-bottom: 10px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(90, 31, 48, 0.45);
            letter-spacing: 1px;
        }

        .section-divider {
            height: 3px;
            background: linear-gradient(to right, transparent, var(--bronze), var(--plum-light), var(--sky), transparent);
            width: 75%;
            margin: 0 auto 40px auto;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .section-divider.footer-divider {
            margin-top: 40px;
            margin-bottom: 24px;
            padding-top: 4px;
        }

        .site-footer {
            text-align: center;
            padding: 0 20px 50px;
            flex-shrink: 0;
        }

        .site-footer p {
            font-size: clamp(9.6px, 1.5vw, 12px);
            color: #ffffff;
            font-weight: 600;
            margin: 0;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
            line-height: 1.6;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            flex: 1;
        }

        .tool-card {
            border-radius: 12px;
            padding: 28px 22px;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 110px;
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-top-width: 5px;
            cursor: pointer;
        }

        .tool-label {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .tool-title {
            font-size: clamp(19px, 2.2vw, 24px);
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: 0.3px;
        }

        .tool-card.accent-sky {
            background: linear-gradient(160deg, rgba(168, 212, 240, 0.32), rgba(255, 255, 255, 0.94));
            border-top-color: var(--sky);
            color: var(--sky-dark);
        }

        .tool-card.accent-sky .tool-label {
            color: var(--bronze);
        }

        .tool-card.accent-sky:hover {
            transform: translateY(-8px);
            box-shadow: 0 14px 24px rgba(30, 90, 138, 0.28);
            border-color: var(--sky-dark);
        }

        .tool-card.accent-bronze {
            background: linear-gradient(160deg, rgba(232, 198, 117, 0.35), rgba(255, 255, 255, 0.94));
            border-top-color: var(--bronze);
            color: var(--plum-dark);
        }

        .tool-card.accent-bronze .tool-label {
            color: var(--sky-dark);
        }

        .tool-card.accent-bronze:hover {
            transform: translateY(-8px);
            box-shadow: 0 14px 24px rgba(201, 149, 46, 0.32);
            border-color: var(--bronze);
        }

        .tool-card.accent-plum {
            background: linear-gradient(160deg, rgba(168, 69, 96, 0.18), rgba(255, 255, 255, 0.94));
            border-top-color: var(--plum);
            color: var(--plum-dark);
        }

        .tool-card.accent-plum .tool-label {
            color: var(--bronze);
        }

        .tool-card.accent-plum:hover {
            transform: translateY(-8px);
            box-shadow: 0 14px 24px rgba(123, 45, 66, 0.28);
            border-color: var(--plum);
        }

        .tool-card.disabled {
            background: rgba(240, 240, 240, 0.9);
            color: #888;
            border-top-color: #bbb;
            cursor: not-allowed;
            pointer-events: none;
        }

        .tool-card.disabled .tool-label {
            color: #aaa;
        }

        /* ===== OS TOOL WORKSPACE (IFRAME CONTAINER) ===== */
        #os-workspace {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: var(--taskbar-height);
            z-index: 500;
            background: #fff;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #os-workspace.visible {
            display: block;
            opacity: 1;
        }

        #os-workspace iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* ===== OS TASKBAR ===== */
        .os-taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1001;
            height: var(--taskbar-height);
            background: linear-gradient(135deg, rgba(30, 90, 138, 0.95), rgba(90, 31, 48, 0.95));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-top: 2px solid var(--bronze);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.25);
            font-family: inherit;
            font-size: 12px;
            color: var(--bronze-light);
            user-select: none;
        }

        .os-taskbar.visible {
            display: flex;
        }

        .os-taskbar-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .os-taskbar-start {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 14px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .os-taskbar-start:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .os-taskbar-start:active {
            background: rgba(255, 255, 255, 0.05);
        }

        /* ===== NÚT QUAY LẠI + BREADCRUMB TRONG TASKBAR ===== */
        .os-taskbar-back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
        }

        .os-taskbar-back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .os-taskbar-back-btn:active {
            background: rgba(255, 255, 255, 0.05);
        }

        .os-taskbar-breadcrumb {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            flex-wrap: nowrap;
            overflow: hidden;
            flex: 1;
        }

        .os-taskbar-breadcrumb .breadcrumb-item {
            padding: 3px 7px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.2s, color 0.2s;
            color: rgba(255, 255, 255, 0.6);
        }

        .os-taskbar-breadcrumb .breadcrumb-item:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .os-taskbar-breadcrumb .breadcrumb-item.active {
            color: var(--bronze-light);
            cursor: default;
        }

        .os-taskbar-breadcrumb .breadcrumb-item.active:hover {
            background: transparent;
        }

        .os-taskbar-breadcrumb .breadcrumb-sep {
            color: rgba(255, 255, 255, 0.35);
            font-size: 14px;
            font-weight: 300;
            flex-shrink: 0;
        }

        .os-taskbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            min-width: 120px;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .os-clock {
            font-weight: 600;
            color: #fff;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        /* ===== OS LOADING OVERLAY ===== */
        .os-loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: var(--taskbar-height);
            z-index: 550;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(2px);
        }

        .os-loading.visible {
            display: flex;
        }

        .os-loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--sky-light);
            border-top-color: var(--sky-dark);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== OS WINDOW HEADER (inside workspace for embedded tools) ===== */
        .os-window-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: none;
            align-items: center;
            padding: 8px 16px;
            background: linear-gradient(135deg, var(--sky-dark), var(--plum-dark));
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            gap: 10px;
            height: 44px;
        }

        .os-window-header.visible {
            display: flex;
        }

        .os-window-header .win-title {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .os-window-header .win-close {
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.15);
            font-size: 16px;
            line-height: 1;
            transition: background 0.2s;
        }

        .os-window-header .win-close:hover {
            background: rgba(255, 50, 50, 0.4);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .tools-grid {
                grid-template-columns: 1fr;
            }
            .orbit-container {
                width: 240px;
                height: 240px;
            }
            .logo-static {
                width: 160px;
            }
            .radar-ring {
                width: 210px;
                height: 210px;
            }
            .radar-ring-2 {
                width: 240px;
                height: 240px;
            }
            .radar-sweep {
                width: 210px;
                height: 210px;
            }
        }

        @media (max-width: 480px) {

            .orbit-container {
                width: 180px;
                height: 180px;
            }
            .logo-static {
                width: 120px;
            }
            .radar-ring {
                width: 160px;
                height: 160px;
            }
            .radar-ring-2 {
                width: 180px;
                height: 180px;
            }
            .radar-sweep {
                width: 160px;
                height: 160px;
            }
        }

    </style>

</head>
<body>

    <!-- ===== MÀN HÌNH CHỜ (LOCK SCREEN) ===== -->
    <div id="landing-page">
        <div class="orbit-container" onclick="showTools()">
            <div class="radar-ring"></div>
            <div class="radar-ring-2"></div>
            <div class="radar-sweep"></div>
            <div id="radar-targets-container"></div>
            <img src=".\static\logo_moi.png" alt="Logo Viện Kiểm Sát" class="logo-static">

        </div>

        <!-- Tiêu đề dạng intro -->
        <div class="landing-title">
            BỘ CÔNG CỤ <span class="landing-title-highlight">NGHIỆP VỤ</span>

        </div>

        <div class="landing-divider"></div>
        <div class="landing-subtitle">
            VIỆN KIỂM SÁT NHÂN DÂN
        </div>

    </div>

    <!-- ===== DESKTOP - MENU CHÍNH ===== -->
    <div id="dashboard-page">
        <div class="header">
            <h1>BỘ CÔNG CỤ HỖ TRỢ NGÀNH KIỂM SÁT NHÂN DÂN</h1>
        </div>

        <div class="section-divider"></div>

        <div class="tools-grid" id="tools-grid">
            <!-- Các công cụ sẽ được JavaScript render -->
        </div>

        <div class="section-divider footer-divider"></div>

        <footer class="site-footer">
            <p>Phát triển bởi: Nguyễn Khắc Tú<br>Đơn vị: Viện Kiểm sát nhân dân khu vực 5 - Bắc Ninh<br>© 2026 - Công cụ nghiệp vụ Kiểm sát nội bộ</p>
        </footer>
    </div>

    <!-- ===== OS WORKSPACE - KHU VỰC CHẠY CÔNG CỤ ===== -->
    <div id="os-workspace">
        <div class="os-window-header" id="os-window-header">
            <span class="win-title" id="win-title">Công cụ</span>
            <span class="win-close" onclick="closeTool()">✕</span>
        </div>
        <iframe id="tool-iframe" src="" title="Công cụ" allow="clipboard-read; clipboard-write"></iframe>
    </div>

    <!-- ===== LOADING OVERLAY ===== -->
    <div class="os-loading" id="os-loading">
        <div class="os-loading-spinner"></div>
    </div>

    <!-- ===== OS TASKBAR ===== -->
    <div class="os-taskbar" id="os-taskbar">
        <div class="os-taskbar-left">
            <div class="os-taskbar-start" onclick="closeTool()">⬥ Bộ công cụ</div>
            <div class="os-taskbar-breadcrumb" id="taskbar-breadcrumb">
                <!-- Breadcrumb rendered here by JS -->
            </div>
        </div>
        <div class="os-taskbar-right">
            <span class="os-clock" id="os-clock">00:00</span>
        </div>
    </div>

    <script>
        // ============================================================
        // DỮ LIỆU CÔNG CỤ
        // ============================================================
        var TOOLS = [
            {
                id: 'tinh-lai-suat',
                label: 'Công cụ',
                title: 'Tính lãi suất',
                url: 'https://app-tinh-lai-suat.onrender.com/',
                accent: 'accent-sky'
            },
            {
                id: 'tinh-an-phi',
                label: 'Công cụ',
                title: 'Tính án phí',

        // ============================================================
        // BIẾN TOÀN CỤC
        // ============================================================
        var isDashboardVisible = false;
        var isInToolView = false;
        var currentToolId = null;
        var activeToolTitle = '';

        // DOM refs
        var landing = document.getElementById('landing-page');
        var dashboard = document.getElementById('dashboard-page');
        var osWorkspace = document.getElementById('os-workspace');
        var osTaskbar = document.getElementById('os-taskbar');
        var toolIframe = document.getElementById('tool-iframe');
        var osLoading = document.getElementById('os-loading');
        var winTitle = document.getElementById('win-title');
        var osClock = document.getElementById('os-clock');
        var breadcrumb = document.getElementById('taskbar-breadcrumb');
        var toolsGrid = document.getElementById('tools-grid');

        // ============================================================
        // KHỞI TẠO
        // ============================================================
        function init() {
            renderToolCards();
            startClock();
        }

        function renderToolCards() {
            var html = '';
            for (var i = 0; i < TOOLS.length; i++) {
                var t = TOOLS[i];
                html += '<div class="tool-card ' + t.accent + '" data-tool-id="' + t.id + '" onclick="openTool(\'' + t.id + '\')">';
                html += '<span class="tool-label">' + t.label + '</span>';
                html += '<span class="tool-title">' + t.title + '</span>';
                if (t.subtitle) {
                    html += '<span style="font-size:13px;opacity:0.7;margin-top:2px;">' + t.subtitle + '</span>';
                }
                html += '</div>';
            }
            // Thêm card disabled
            html += '<div class="tool-card disabled">';
            html += '<span class="tool-label">Sắp ra mắt</span>';
            html += '<span class="tool-title">Công cụ tra cứu thời hạn tố tụng</span>';
            html += '</div>';
            toolsGrid.innerHTML = html;
        }

        // ============================================================
        // CHUYỂN CẢNH (TRANSITIONS)
        // ============================================================
        function fadeToDashboard() {
            landing.style.opacity = '0';
            setTimeout(function () {
                landing.style.display = 'none';
                dashboard.style.display = 'flex';
                dashboard.classList.add('visible-layout');
                setTimeout(function () {
                    dashboard.style.opacity = '1';
                }, 50);
                isDashboardVisible = true;
            }, 500);
        }

        function fadeToLanding() {
            if (isInToolView) {
                closeToolInternal();
            }
            dashboard.style.opacity = '0';
            setTimeout(function () {
                dashboard.style.display = 'none';
                dashboard.classList.remove('visible-layout');
                landing.style.display = 'flex';
                setTimeout(function () {
                    landing.style.opacity = '1';
                }, 50);
                isDashboardVisible = false;
            }, 500);
        }

        function showTools() {
            fadeToDashboard();
        }

        function showLanding() {
            fadeToLanding();
        }

        // ============================================================
        // MỞ / ĐÓNG CÔNG CỤ TRONG WORKSPACE
        // ============================================================
        function openTool(toolId) {
            var tool = null;
            for (var i = 0; i < TOOLS.length; i++) {
                if (TOOLS[i].id === toolId) {
                    tool = TOOLS[i];
                    break;
                }
            }
            if (!tool) return;

            // Nếu công cụ có flag newTab, mở tab mới thay vì iframe
            if (tool.newTab) {
                window.open(tool.url, '_blank');
                return;
            }

            currentToolId = toolId;
            activeToolTitle = tool.title;
            isInToolView = true;

            // Ẩn dashboard, hiện workspace + taskbar
            dashboard.style.opacity = '0';
            dashboard.style.display = 'none';
            dashboard.classList.remove('visible-layout');

            // Hiển thị loading
            osLoading.classList.add('visible');

            // Hiện workspace và taskbar
            osWorkspace.style.display = 'block';
            osTaskbar.classList.add('visible');

            // Cập nhật tiêu đề
            winTitle.textContent = tool.title;
            updateBreadcrumb();

            // Set iframe source
            toolIframe.src = tool.url;

            // Khi iframe load xong, ẩn loading
            toolIframe.onload = function () {
                osLoading.classList.remove('visible');
                osWorkspace.classList.add('visible');
            };

            // Fallback: nếu không load được, vẫn tắt loading sau 10s
            setTimeout(function () {
                osLoading.classList.remove('visible');
                osWorkspace.classList.add('visible');
            }, 10000);

            isDashboardVisible = false;
        }


        function closeTool() {
            closeToolInternal();
            // Quay về dashboard
            dashboard.style.display = 'flex';
            dashboard.classList.add('visible-layout');
            setTimeout(function () {
                dashboard.style.opacity = '1';
            }, 50);
            isDashboardVisible = true;
        }

        function closeToolInternal() {
            isInToolView = false;
            currentToolId = null;

            // Ẩn workspace
            osWorkspace.classList.remove('visible');
            osWorkspace.style.display = 'none';

            // Xóa iframe src để dừng tải
            toolIframe.src = '';
            toolIframe.onload = null;

            // Ẩn taskbar, loading
            osTaskbar.classList.remove('visible');
            osLoading.classList.remove('visible');

            updateBreadcrumb();
        }

        // ============================================================
        // BREADCRUMB (Sơ đồ cây)
        // ============================================================
        function updateBreadcrumb() {
            var html = '';
            // Mục "Bộ công cụ"
            html += '<span class="breadcrumb-item" onclick="closeTool()">Bộ công cụ</span>';
            html += '<span class="breadcrumb-sep">›</span>';
            // Mục "Menu chính"
            html += '<span class="breadcrumb-item" onclick="closeTool()">Menu chính</span>';

            if (currentToolId) {
                html += '<span class="breadcrumb-sep">›</span>';
                html += '<span class="breadcrumb-item active">' + activeToolTitle + '</span>';
            }

            breadcrumb.innerHTML = html;
        }

        // ============================================================
        // ĐỒNG HỒ
        // ============================================================
        function startClock() {
            updateClock();
            setInterval(updateClock, 1000);
        }

        function updateClock() {
            var now = new Date();
            var h = String(now.getHours()).padStart(2, '0');
            var m = String(now.getMinutes()).padStart(2, '0');
            var dow = getDayOfWeek(now.getDay());
            var d = String(now.getDate()).padStart(2, '0');
            var mon = String(now.getMonth() + 1).padStart(2, '0');
            osClock.textContent = dow + ', ' + d + '/' + mon + ' ' + h + ':' + m;
        }

        function getDayOfWeek(dayIndex) {
            var days = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
            return days[dayIndex];
        }

        // ============================================================
        // XỬ LÝ LỖI IFRAME (KHI TRANG WEB TỪ CHỐI EMBED)
        // ============================================================
        window.addEventListener('message', function (e) {
            // Lắng nghe message từ iframe nếu có
        });

        // Phát hiện lỗi iframe blocked
        var checkIframeError = setInterval(function () {
            if (!isInToolView) return;
            try {
                var doc = toolIframe.contentDocument || toolIframe.contentWindow.document;
                if (doc && doc.body) {
                    // OK
                }
            } catch (e) {
                // CORS error - trang đã load nhưng từ domain khác (bình thường)
            }
        }, 2000);

        // ============================================================
        // ESCAPE KEY - ĐÓNG CÔNG CỤ
        // ============================================================
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && isInToolView) {
                closeTool();
            }
        });

        // ============================================================
        // RADAR TARGETS - ĐỐM SÁNG MỤC TIÊU NGẪU NHIÊN
        // ============================================================
        var radarContainer = document.getElementById('radar-targets-container');
        var radarTargets = [];
        var sweepAngle = 0;
        var sweepRadius = 140; // bán kính vùng quét

        // Màu sắc cho các đốm mục tiêu
        var targetColors = [
            { bg: 'rgba(232, 198, 117, 0.9)', shadow: 'rgba(232, 198, 117, 0.6)' },
            { bg: 'rgba(93, 169, 217, 0.8)', shadow: 'rgba(93, 169, 217, 0.5)' },
            { bg: 'rgba(255, 248, 220, 0.9)', shadow: 'rgba(232, 198, 117, 0.7)' },
            { bg: 'rgba(232, 198, 117, 0.7)', shadow: 'rgba(232, 198, 117, 0.4)' },
            { bg: 'rgba(168, 69, 96, 0.7)', shadow: 'rgba(168, 69, 96, 0.4)' },
        ];

        function getOrbitSize() {
            // Lấy kích thước orbit-container thực tế
            var container = document.querySelector('.orbit-container');
            var w = container.offsetWidth || 320;
            return w / 2 - 20; // trừ lề
        }

        function getRandomPosition() {
            var r = getOrbitSize();
            // Tạo góc ngẫu nhiên (radian)
            var angle = Math.random() * 2 * Math.PI;
            // Bán kính ngẫu nhiên từ 75% đến 95% bán kính quét
            // (nằm giữa rìa logo và vòng radar bên ngoài)
            var dist = (0.75 + Math.random() * 0.2) * r;
            var x = 50 + (dist * Math.cos(angle)) / (r / 50);
            var y = 50 + (dist * Math.sin(angle)) / (r / 50);
            return { x: x, y: y, angle: angle, dist: dist };
        }


        function createTarget() {
            var pos = getRandomPosition();
            var color = targetColors[Math.floor(Math.random() * targetColors.length)];
            var size = 2 + Math.random() * 3; // 2-5px

            var el = document.createElement('div');
            el.className = 'radar-target';
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.left = pos.x + '%';
            el.style.top = pos.y + '%';
            el.style.marginLeft = (-size/2) + 'px';
            el.style.marginTop = (-size/2) + 'px';
            el.style.background = color.bg;
            el.style.boxShadow = '0 0 ' + (size * 2) + 'px ' + color.shadow + ', 0 0 ' + (size * 4) + 'px ' + color.shadow;

            radarContainer.appendChild(el);

            return {
                el: el,
                angle: pos.angle,
                dist: pos.dist,
                hit: false,
                visible: false
            };
        }

        function spawnTargets() {
            // Xóa các target cũ
            for (var i = 0; i < radarTargets.length; i++) {
                if (radarTargets[i].el.parentNode) {
                    radarTargets[i].el.parentNode.removeChild(radarTargets[i].el);
                }
            }
            radarTargets = [];

            // Sinh ngẫu nhiên 5-8 target mới
            var count = 5 + Math.floor(Math.random() * 4); // 5-8

            for (var i = 0; i < count; i++) {
                radarTargets.push(createTarget());
            }
        }

        function updateRadarTargets() {
            // Lấy góc quét hiện tại từ animation (0-360)
            // Do CSS animation quay 4s/vòng, ta tính góc dựa trên thời gian
            var now = Date.now();
            sweepAngle = ((now / 1000) * 90) % 360; // 360 độ / 4s = 90 độ/s

            for (var i = 0; i < radarTargets.length; i++) {
                var t = radarTargets[i];
                // Góc của target (độ)
                var targetAngleDeg = (t.angle * 180 / Math.PI + 360) % 360;
                // Tính chênh lệch góc giữa tia quét và target
                var diff = (sweepAngle - targetAngleDeg + 360) % 360;

                // Nếu tia quét vừa đi qua target (trong khoảng 8 độ)
                if (diff >= 0 && diff <= 8 && !t.hit) {
                    t.hit = true;
                    t.visible = true;
                    t._detectedTime = now;
                    t.el.classList.add('hit');
                    // Sau khi hit xong, giữ visible
                    setTimeout(function(el) {
                        return function() {
                            el.classList.remove('hit');
                            el.classList.add('visible');
                        };
                    }(t.el), 600);
                }

                // Nếu target đã được phát hiện, giảm dần độ sáng
                if (t.visible && !t.el.classList.contains('hit')) {
                    var age = (now - t._detectedTime) / 1000;
                    if (age > 3) {
                        // Mờ dần sau 3 giây
                        var opacity = Math.max(0, 1 - (age - 3) / 2);
                        t.el.style.opacity = opacity;
                        if (opacity <= 0) {
                            t.visible = false;
                        }
                    }
                }

            }
        }

        // Khởi tạo radar targets
        function initRadar() {
            spawnTargets();
            // Cập nhật mỗi 100ms để kiểm tra góc quét
            setInterval(function() {
                updateRadarTargets();
            }, 100);
            // Thay đổi vị trí targets mỗi 12 giây
            setInterval(function() {
                spawnTargets();
            }, 12000);
        }

        // Ghi đè hàm init để thêm radar
        var originalInit = init;
        init = function() {
            originalInit();
            initRadar();
        };

        // ============================================================
        // KHỞI CHẠY
        // ============================================================
        init();
    </script>
