<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro - Bộ công cụ Kiểm sát</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Be Vietnam Pro', Arial, sans-serif;
            background: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* ===== INTRO CONTAINER ===== */
        #intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        /* ===== NỀN CHÍNH ===== */
        .intro-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('./static/Nen.jpg') center / cover no-repeat;
            filter: brightness(0.3) saturate(1.2) blur(2px);
            transform: scale(1.1);
            animation: bgZoomIn 4s ease-out forwards;
        }

        @keyframes bgZoomIn {
            0% { transform: scale(1.3); filter: brightness(0.15) saturate(0.8) blur(4px); }
            100% { transform: scale(1); filter: brightness(0.35) saturate(1.2) blur(2px); }
        }

        /* ===== LỚP PHỦ MÀU ===== */
        .intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                135deg,
                rgba(30, 90, 138, 0.55) 0%,
                rgba(123, 45, 66, 0.40) 40%,
                rgba(201, 149, 46, 0.25) 70%,
                rgba(0, 0, 0, 0.6) 100%
            );
            z-index: 1;
        }

        /* ===== HIỆU ỨNG HẠT BỤI / PARTICLE ===== */
        .particle-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(232, 198, 117, 0.6);
            border-radius: 50%;
            animation: particleFloat linear infinite;
            box-shadow: 0 0 6px rgba(232, 198, 117, 0.3);
        }

        @keyframes particleFloat {
            0% { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(50px) scale(1); opacity: 0; }
        }

        /* ===== NỘI DUNG TRUNG TÂM ===== */
        .intro-content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            animation: contentFadeIn 1.5s ease-out 0.5s both;
        }

        @keyframes contentFadeIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== LOGO ===== */
        .logo-wrapper {
            position: relative;
            margin-bottom: 20px;
            animation: logoEntrance 2s cubic-bezier(0.22, 1, 0.36, 1) 0.8s both;
        }

        @keyframes logoEntrance {
            0% { 
                opacity: 0; 
                transform: scale(0.3) rotate(-15deg);
                filter: brightness(2) blur(10px);
            }
            50% {
                filter: brightness(1.5) blur(0);
            }
            100% { 
                opacity: 1; 
                transform: scale(1) rotate(0deg);
                filter: brightness(1) blur(0);
            }
        }

        .intro-logo {
            width: 200px;
            height: auto;
            filter: drop-shadow(0 0 30px rgba(232, 198, 117, 0.3));
            animation: logoPulse 3s ease-in-out infinite 2s;
        }

        @keyframes logoPulse {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(232, 198, 117, 0.2)) brightness(1); }
            50% { filter: drop-shadow(0 0 40px rgba(232, 198, 117, 0.5)) brightness(1.08); }
        }

        /* ===== VÒNG SÁNG QUANH LOGO ===== */
        .logo-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 280px;
            height: 280px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(232, 198, 117, 0.15);
            animation: ringExpand 2.5s ease-out 1s both, ringRotate 8s linear infinite 2.5s;
            pointer-events: none;
        }

        .logo-ring-2 {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 320px;
            height: 320px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 1px solid rgba(93, 169, 217, 0.1);
            animation: ringExpand 2.5s ease-out 1.2s both, ringRotate 12s linear infinite reverse 2.5s;
            pointer-events: none;
        }

        @keyframes ringExpand {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        @keyframes ringRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* ===== TIA SÁNG QUÉT ===== */
        .light-sweep {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                transparent 0deg,
                transparent 300deg,
                rgba(232, 198, 117, 0.08) 310deg,
                rgba(255, 248, 220, 0.2) 320deg,
                rgba(232, 198, 117, 0.08) 330deg,
                transparent 340deg,
                transparent 360deg
            );
            animation: sweepRotate 4s ease-in-out infinite 2s;
            pointer-events: none;
            border-radius: 50%;
        }

        @keyframes sweepRotate {
            0% { transform: rotate(0deg); opacity: 0.3; }
            50% { opacity: 1; }
            100% { transform: rotate(360deg); opacity: 0.3; }
        }

        /* ===== DÒNG CHỮ CHÍNH ===== */
        .intro-title {
            font-size: clamp(28px, 5vw, 52px);
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
            animation: titleReveal 1.8s cubic-bezier(0.22, 1, 0.36, 1) 1.5s both;
            line-height: 1.2;
        }

        .intro-title .highlight {
            background: linear-gradient(135deg, #e8c675, #f5d98a, #c9952e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes titleReveal {
            0% { 
                opacity: 0; 
                transform: translateY(40px) scale(0.95);
                clip-path: inset(0 0 100% 0);
            }
            100% { 
                opacity: 1; 
                transform: translateY(0) scale(1);
                clip-path: inset(0 0 0 0);
            }
        }

        /* ===== DÒNG PHỤ ===== */
        .intro-subtitle {
            font-size: clamp(12px, 1.8vw, 18px);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 12px;
            animation: subtitleReveal 1.5s ease-out 2.2s both;
        }

        @keyframes subtitleReveal {
            0% { opacity: 0; transform: translateY(20px); letter-spacing: 20px; }
            100% { opacity: 1; transform: translateY(0); letter-spacing: 8px; }
        }

        /* ===== ĐƯỜNG KẺ TRANG TRÍ ===== */
        .intro-divider {
            width: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(232, 198, 117, 0.6), transparent);
            margin: 16px auto;
            animation: dividerExpand 1.2s ease-out 2.8s forwards;
            border-radius: 2px;
        }

        @keyframes dividerExpand {
            0% { width: 0; }
            100% { width: 60%; max-width: 400px; }
        }

        /* ===== NĂM / THÔNG TIN ===== */
        .intro-year {
            font-size: clamp(14px, 2vw, 22px);
            font-weight: 700;
            color: rgba(232, 198, 117, 0.8);
            letter-spacing: 4px;
            margin-top: 8px;
            animation: subtitleReveal 1.2s ease-out 3.2s both;
        }

        /* ===== NÚT BỎ QUA / SKIP ===== */
        .skip-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            z-index: 10;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.5);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.5s ease-out 4s both;
        }

        .skip-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            border-color: rgba(232, 198, 117, 0.4);
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== THANH TIẾN TRÌNH ===== */
        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(to right, #5da9d9, #c9952e, #7b2d42);
            z-index: 5;
            width: 0%;
            animation: progressFill 5s linear forwards;
        }

        @keyframes progressFill {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* ===== HIỆU ỨNG KẾT THÚC ===== */
        .intro-exit {
            animation: introExit 0.8s ease-in forwards;
        }

        @keyframes introExit {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.1); filter: blur(10px); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .intro-logo {
                width: 140px;
            }
            .logo-ring {
                width: 200px;
                height: 200px;
            }
            .logo-ring-2 {
                width: 240px;
                height: 240px;
            }
            .intro-title {
                letter-spacing: 3px;
            }
            .intro-subtitle {
                letter-spacing: 4px;
                font-size: 11px;
            }
            .skip-btn {
                bottom: 20px;
                right: 20px;
                padding: 8px 16px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .intro-logo {
                width: 100px;
            }
            .logo-ring {
                width: 150px;
                height: 150px;
            }
            .logo-ring-2 {
                width: 180px;
                height: 180px;
            }
            .intro-title {
                font-size: 20px;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== INTRO OVERLAY ===== -->
    <div id="intro-container">
        <!-- Nền -->
        <div class="intro-bg"></div>
        <div class="intro-overlay"></div>

        <!-- Particle Effects -->
        <div class="particle-field" id="particle-field"></div>

        <!-- Thanh tiến trình -->
        <div class="progress-bar" id="progress-bar"></div>

        <!-- Nút bỏ qua -->
        <button class="skip-btn" onclick="skipIntro()">Bỏ qua ✕</button>

        <!-- Nội dung chính -->
        <div class="intro-content">
            <!-- Logo với hiệu ứng -->
            <div class="logo-wrapper">
                <div class="light-sweep"></div>
                <div class="logo-ring"></div>
                <div class="logo-ring-2"></div>
                <img src="./static/logo_moi.png" alt="Logo Viện Kiểm Sát" class="intro-logo">
            </div>

            <!-- Tiêu đề -->
            <div class="intro-title">
                BỘ CÔNG CỤ <span class="highlight">KIỂM SÁT</span>
            </div>

            <!-- Đường kẻ -->
            <div class="intro-divider"></div>

            <!-- Phụ đề -->
            <div class="intro-subtitle">
                VIỆN KIỂM SÁT NHÂN DÂN
            </div>

            <!-- Năm -->
            <div class="intro-year">✦ 2026 ✦</div>
        </div>
    </div>

    <script>
        // ============================================================
        // TẠO HẠT BỤI (PARTICLES)
        // ============================================================
        (function createParticles() {
            var field = document.getElementById('particle-field');
            var count = 60;
            for (var i = 0; i < count; i++) {
                var p = document.createElement('div');
                p.className = 'particle';
                var size = Math.random() * 3 + 1;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDuration = (Math.random() * 8 + 6) + 's';
                p.style.animationDelay = (Math.random() * 8) + 's';
                p.style.opacity = Math.random() * 0.5 + 0.1;
                field.appendChild(p);
            }
        })();

        // ============================================================
        // TỰ ĐỘNG KẾT THÚC INTRO SAU 5 GIÂY
        // ============================================================
        var introTimeout = setTimeout(function() {
            finishIntro();
        }, 5200);

        // ============================================================
        // BỎ QUA INTRO
        // ============================================================
        function skipIntro() {
            clearTimeout(introTimeout);
            finishIntro();
        }

        // ============================================================
        // KẾT THÚC INTRO
        // ============================================================
        function finishIntro() {
            var container = document.getElementById('intro-container');
            container.classList.add('intro-exit');
            
            // Sau hiệu ứng kết thúc, chuyển hướng
            setTimeout(function() {
                container.style.display = 'none';
                // Có thể chuyển đến trang chính ở đây
                // window.location.href = 'index.html';
                
                // Hiển thị thông báo đã sẵn sàng
                document.body.innerHTML = `
                    <div style="
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        height: 100vh;
                        background: linear-gradient(135deg, rgba(30,90,138,0.9), rgba(90,31,48,0.8)),
                            url('./static/Nen.jpg') center/cover no-repeat fixed;
                        font-family: 'Be Vietnam Pro', Arial, sans-serif;
                        color: #fff;
                        text-align: center;
                        padding: 20px;
                    ">
                        <img src="./static/logo_moi.png" alt="Logo" style="width:120px;margin-bottom:24px;filter:drop-shadow(0 0 20px rgba(232,198,117,0.3));">
                        <h1 style="font-size:clamp(24px,4vw,40px);font-weight:800;text-transform:uppercase;letter-spacing:3px;margin-bottom:12px;">
                            BỘ CÔNG CỤ <span style="background:linear-gradient(135deg,#e8c675,#c9952e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">KIỂM SÁT</span>
                        </h1>
                        <p style="font-size:clamp(14px,2vw,18px);opacity:0.7;letter-spacing:6px;text-transform:uppercase;margin-bottom:30px;">
                            Viện Kiểm Sát Nhân Dân
                        </p>
                        <p style="font-size:16px;opacity:0.6;max-width:500px;line-height:1.6;">
                            Intro đã hoàn tất. Bạn có thể nhúng đoạn intro này vào <strong>index.html</strong> gốc.
                        </p>
                        <div style="margin-top:30px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;">
                            <a href="index.html" style="
                                padding:14px 36px;
                                background:linear-gradient(135deg,#1e5a8a,#5da9d9);
                                color:#fff;
                                text-decoration:none;
                                border-radius:10px;
                                font-weight:700;
                                font-size:16px;
                                transition:transform 0.2s;
                                box-shadow:0 4px 16px rgba(30,90,138,0.4);
                            " onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='translateY(0)'">
                                Vào trang chính →
                            </a>
                            <button onclick="replayIntro()" style="
                                padding:14px 36px;
                                background:rgba(255,255,255,0.1);
                                color:#fff;
                                border:1px solid rgba(255,255,255,0.2);
                                border-radius:10px;
                                font-weight:600;
                                font-size:16px;
                                cursor:pointer;
                                font-family:inherit;
                                transition:all 0.2s;
                            " onmouseover="this.style.background='rgba(255,255,255,0.2)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">
                                ↻ Xem lại Intro
                            </button>
                        </div>
                    </div>
                `;
            }, 800);
        }

        // ============================================================
        // XEM LẠI INTRO
        // ============================================================
        function replayIntro() {
            location.reload();
        }

        // ============================================================
        // PHÁT HIỆN KHI NGƯỜI DÙNG CLICK VÀO MÀN HÌNH (CÓ THỂ BỎ QUA)
        // ============================================================
        document.addEventListener('click', function(e) {
            // Nếu click vào nút skip thì không xử lý (đã có handler riêng)
            if (e.target.closest('.skip-btn')) return;
            // Click vào màn hình cũng có thể bỏ qua (tuỳ chọn)
            // Bỏ comment dòng dưới nếu muốn click để bỏ qua
            // skipIntro();
        });
    </script>

</body>
</html>
